name: Windows Tailscale SSH & Auto Backup Workflow

on:
  workflow_dispatch:

jobs:
  secure-ssh:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python & Pyrogram
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram tgcrypto requests

      - name: Install and Enable OpenSSH Server
        shell: powershell
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          if (!(Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
          }

      - name: Create Windows SSH User with Random Password
        shell: powershell
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY
          
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"
          $randomPass = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          $username = "R-BOT"
          $securePass = ConvertTo-SecureString $randomPass -AsPlainText -Force

          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          
          echo "SSH_USER=$username" >> $env:GITHUB_ENV
          echo "SSH_PASS=$randomPass" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP assignment failed."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Intercept Shutdown and Reboot
        shell: powershell
        run: |
          $fakeRebootCmd = @(
              "@echo off",
              "echo [+] Reboot command intercepted! Refreshing SSH Service...",
              "net stop sshd /y",
              "net start sshd",
              "echo [+] SSH Service refreshed. Session safe!"
          ) -join "`r`n"

          Set-Content -Path "C:\Windows\System32\reboot.bat" -Value $fakeRebootCmd -Force
          Set-Content -Path "C:\Windows\System32\shutdown.bat" -Value $fakeRebootCmd -Force

      - name: Save SSH Details to File
        shell: powershell
        env:
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          SSH_USER: ${{ env.SSH_USER }}
          SSH_PASS: ${{ env.SSH_PASS }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          $repoName = "$env:GH_REPO".Split('/')[1]
          $content = @"
          ==========================================
          SSH CONNECTION DETAILS
          ==========================================
          Project: $repoName
          Repository: $env:GH_REPO
          Run ID: $env:GH_RUN_ID
          Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          
          Connection Details:
          IP Address: $env:TAILSCALE_IP
          Username: $env:SSH_USER
          Password: $env:SSH_PASS
          
          SSH Command:
          ssh $env:SSH_USER@$env:TAILSCALE_IP
          ==========================================
          "@
          $content | Out-File -FilePath windows.txt -Encoding utf8
          
          Write-Host "`n============================================"
          Write-Host "✅ SSH DETAILS SAVED"
          Write-Host "============================================"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "User: $env:SSH_USER"
          Write-Host "Pass: $env:SSH_PASS"
          Write-Host "============================================`n"

      - name: Upload to GitHub
        shell: powershell
        env:
          CUSTOM_GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        run: |
          if (-not $env:CUSTOM_GITHUB_TOKEN) {
            Write-Host "⚠️ CUSTOM_GITHUB_TOKEN not set - skipping GitHub upload"
            exit 0
          }

          @"
          import os
          import base64
          import requests
          
          with open("windows.txt", "r", encoding="utf-8") as f:
              content = f.read()

          token = os.environ.get("CUSTOM_GITHUB_TOKEN")
          if not token:
              print("No token found")
              exit(0)
              
          url = "https://api.github.com/repos/enwjd0262-prog/ip-and-ssh-json/contents/windows.txt"
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          
          # Get existing file SHA
          response = requests.get(url, headers=headers)
          sha = response.json().get("sha") if response.status_code == 200 else None
          
          # Upload
          payload = {
              "message": f"Update SSH details - Run {os.environ.get('GITHUB_RUN_ID')}",
              "content": base64.b64encode(content.encode()).decode(),
              "branch": "main"
          }
          if sha:
              payload["sha"] = sha
              
          result = requests.put(url, headers=headers, json=payload)
          if result.status_code in [200, 201]:
              print("✅ Uploaded to GitHub successfully!")
          else:
              print(f"❌ Upload failed: {result.status_code}")
          "@ | Out-File -FilePath upload.py -Encoding utf8
          
          python upload.py

      - name: Backup to Telegram (Optional)
        shell: powershell
        env:
          TG_SESSION: ${{ secrets.SESSION }}
        run: |
          if (-not $env:TG_SESSION) {
            Write-Host "ℹ️ TG_SESSION not set - skipping Telegram backup"
            exit 0
          }

          @"
          import os
          try:
              from pyrogram import Client
              
              session = os.environ.get("TG_SESSION")
              if not session:
                  print("No session found")
                  exit(0)
                  
              app = Client("backup", session_string=session, api_id=24332846, api_hash="d80da039a525eee8574ca43e21a96e2e")
              app.start()
              
              if os.path.exists("windows.txt"):
                  app.send_document(
                      chat_id=-1003991161350,
                      document="windows.txt",
                      caption="✅ SSH Details Backup"
                  )
                  print("✅ Sent to Telegram!")
              
              app.stop()
          except Exception as e:
              print(f"⚠️ Telegram backup skipped: {e}")
          "@ | Out-File -FilePath telegram.py -Encoding utf8
          
          python telegram.py

      - name: Keep SSH Connection Alive
        shell: powershell
        run: |
          Write-Host "`n============================================"
          Write-Host "🚀 SSH SERVER IS RUNNING"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "📡 SSH Connection Details:"
          Write-Host "   IP: $env:TAILSCALE_IP"
          Write-Host "   User: $env:SSH_USER"
          Write-Host "   Pass: $env:SSH_PASS"
          Write-Host ""
          Write-Host "🔗 Connect with:"
          Write-Host "   ssh $env:SSH_USER@$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "⏱️  Connection will stay active for 6 hours"
          Write-Host "============================================`n"
          
          # Simple keep-alive loop with error handling
          $counter = 0
          while ($true) {
              $counter++
              $time = Get-Date -Format "HH:mm:ss"
              Write-Host "[$time] 🔵 Connection active - $counter minutes"
              
              # Check SSH service every 5 minutes
              if ($counter % 5 -eq 0) {
                  $service = Get-Service sshd -ErrorAction SilentlyContinue
                  if ($service.Status -eq 'Running') {
                      Write-Host "[$time] ✅ SSH Service: Running"
                  } else {
                      Write-Host "[$time] ⚠️ SSH Service: $($service.Status) - Restarting..."
                      Start-Service sshd
                  }
              }
              
              Start-Sleep -Seconds 60
          }
