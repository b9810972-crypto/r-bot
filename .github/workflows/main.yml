name: Windows Tailscale SSH & Auto Backup Workflow

on:
  workflow_dispatch:

jobs:
  secure-ssh:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python & Pyrogram
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram tgcrypto requests

      - name: Install and Enable OpenSSH Server
        shell: powershell
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          if (!(Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
          }

      - name: Create Windows SSH User with Random Password
        shell: powershell
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY
          
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"
          $randomPass = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          $username = "R-BOT"
          $securePass = ConvertTo-SecureString $randomPass -AsPlainText -Force

          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          
          echo "SSH_USER=$username" >> $env:GITHUB_ENV
          echo "SSH_PASS=$randomPass" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP assignment failed."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Intercept Shutdown and Reboot
        shell: powershell
        run: |
          $fakeRebootCmd = @(
              "@echo off",
              "echo [+] Reboot command intercepted! Refreshing SSH Service...",
              "net stop sshd /y",
              "net start sshd",
              "echo [+] SSH Service refreshed. Session safe!"
          ) -join "`r`n"

          Set-Content -Path "C:\Windows\System32\reboot.bat" -Value $fakeRebootCmd -Force
          Set-Content -Path "C:\Windows\System32\shutdown.bat" -Value $fakeRebootCmd -Force

      - name: Save SSH Details to File
        shell: powershell
        env:
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          SSH_USER: ${{ env.SSH_USER }}
          SSH_PASS: ${{ env.SSH_PASS }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          $repoName = "$env:GH_REPO".Split('/')[1]
          $content = @"
          Project 1
          ==========================================
          Project Name: $repoName
          Repository:   $env:GH_REPO
          Run ID:       $env:GH_RUN_ID
          ------------------------------------------
          Windows SSH Connection Details:
          IP Address:   $env:TAILSCALE_IP
          Username:     $env:SSH_USER
          Password:     $env:SSH_PASS
          Command:      ssh $env:SSH_USER@$env:TAILSCALE_IP
          ==========================================
          "@
          $content | Out-File -FilePath windows.txt -Encoding utf8
          
          # Also save as output for display
          Write-Host "SSH Connection Details:"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "User: $env:SSH_USER"
          Write-Host "Pass: $env:SSH_PASS"

      - name: Upload SSH Details to GitHub
        shell: powershell
        env:
          CUSTOM_GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        run: |
          if (-not $env:CUSTOM_GITHUB_TOKEN) {
            Write-Host "⚠️ CUSTOM_GITHUB_TOKEN not set! Skipping GitHub upload."
            exit 0
          }

          @"
          import os
          import base64
          import requests

          # Read the file content
          with open("windows.txt", "r", encoding="utf-8") as f:
              content = f.read()

          target_repo = "enwjd0262-prog/ip-and-ssh-json"
          file_path = "windows.txt"
          github_token = os.environ.get("CUSTOM_GITHUB_TOKEN")
          api_url = f"https://api.github.com/repos/{target_repo}/contents/{file_path}"

          headers = {
              "Authorization": f"token {github_token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # Check if file exists
          get_response = requests.get(api_url, headers=headers)
          sha = None
          if get_response.status_code == 200:
              sha = get_response.json().get("sha")
              print("[+] Existing file found. Will update.")
          else:
              print("[+] No existing file. Will create new.")

          # Prepare for upload
          encoded = base64.b64encode(content.encode("utf-8")).decode("utf-8")
          payload = {
              "message": f"Update Windows SSH details - Run {os.environ.get('GITHUB_RUN_ID')}",
              "content": encoded,
              "branch": "main"
          }
          if sha:
              payload["sha"] = sha

          # Upload
          response = requests.put(api_url, headers=headers, json=payload)
          if response.status_code in [200, 201]:
              print("[+] Successfully uploaded to GitHub!")
          else:
              print(f"[-] Upload failed: {response.status_code}")
              print(f"[-] Response: {response.text}")
          "@ | Out-File -FilePath upload.py -Encoding utf8
          
          python upload.py

      - name: Backup to Telegram (Optional)
        shell: powershell
        env:
          TG_SESSION: ${{ secrets.SESSION }}
        run: |
          if (-not $env:TG_SESSION) {
            Write-Host "ℹ️ TG_SESSION not set - skipping Telegram backup"
            exit 0
          }

          @"
          import os
          import time
          
          try:
              from pyrogram import Client
              
              api_id = 24332846
              api_hash = "d80da039a525eee8574ca43e21a96e2e"
              session_string = os.environ.get("TG_SESSION")
              channel_id = -1003991161350

              app = Client("backup", session_string=session_string, api_id=api_id, api_hash=api_hash)
              app.start()
              
              # Send backup
              if os.path.exists("windows.txt"):
                  app.send_document(
                      chat_id=channel_id,
                      document="windows.txt",
                      caption="✅ SSH Details Backup"
                  )
                  print("[+] Backup sent to Telegram!")
              
              app.stop()
              
          except Exception as e:
              print(f"[-] Telegram backup failed: {e}")
              print("[*] This is optional - SSH is still running!")
          "@ | Out-File -FilePath telegram_backup.py -Encoding utf8
          
          python telegram_backup.py

      - name: Maintain SSH Connection
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "✅ SSH SERVER IS RUNNING AND ACCESSIBLE"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "SSH Connection Details:"
          Write-Host "IP Address: $env:TAILSCALE_IP"
          Write-Host "Username:   $env:SSH_USER"
          Write-Host "Password:   $env:SSH_PASS"
          Write-Host ""
          Write-Host "Command to connect:"
          Write-Host "ssh $env:SSH_USER@$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "============================================"
          Write-Host ""
          Write-Host "🔄 Keeping connection alive for 60 minutes..."
          Write-Host "Press Ctrl+C to stop (but this will close SSH access)"
          Write-Host ""
          
          # Keep the runner alive
          $endTime = (Get-Date).AddMinutes(60)
          while ((Get-Date) -lt $endTime) {
              Write-Host "🟢 Connection active - $(Get-Date -Format 'HH:mm:ss') - Remaining: $([math]::Round(($endTime - (Get-Date)).TotalMinutes)) minutes"
              Start-Sleep -Seconds 60
          }
          
          Write-Host "⏰ Time's up! Workflow will complete."
