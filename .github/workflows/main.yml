name: Windows SSH Workflow

on:
  workflow_dispatch:

jobs:
  secure-ssh:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Install and Enable OpenSSH Server
        shell: powershell
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          if (!(Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
          }

      - name: Create Windows SSH User with Random Password
        shell: powershell
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY
          
          # Random Password Generator (16 chars)
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"
          $randomPass = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          $username = "R-BOT"
          $securePass = ConvertTo-SecureString $randomPass -AsPlainText -Force

          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          
          "SSH_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SSH_PASS=$randomPass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Establish Bore TCP Tunnel
        shell: powershell
        run: |
          # 1. Download & Extract Bore Tunnel Tool
          $boreZip = "$env:TEMP\bore.zip"
          $boreDir = "$env:TEMP\bore"
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile $boreZip
          Expand-Archive -Path $boreZip -DestinationPath $boreDir -Force
          $boreExe = "$boreDir\bore.exe"

          # 2. Start Bore Tunnel for Port 22
          $logPath = "$env:TEMP\bore.log"
          Start-Process $boreExe -ArgumentList "local 22 --to bore.pub" -RedirectStandardError $logPath -RedirectStandardOutput "$env:TEMP\bore_out.log"

          $tunnelPort = ""
          $retries = 0

          # 3. Read Assigned Port (~45 Seconds Timeout)
          while (-not $tunnelPort -and $retries -lt 15) {
              Start-Sleep -Seconds 3
              if (Test-Path $logPath) {
                  $logContent = Get-Content $logPath -Raw -ErrorAction SilentlyContinue
                  if ($logContent -match "bore\.pub:(\d+)") {
                      $tunnelPort = $matches[1]
                  }
              }
              $retries++
          }

          if (-not $tunnelPort) {
              Write-Host "=== ERROR LOGS ===" -ForegroundColor Red
              if (Test-Path $logPath) { Get-Content $logPath }
              Write-Error "Bore tunnel assignment failed."
              exit 1
          }

          Write-Host "[+] Bore Tunnel Created Successfully on Port: $tunnelPort" -ForegroundColor Green

          "SSH_HOST=bore.pub" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SSH_PORT=$tunnelPort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Intercept Shutdown and Reboot
        shell: powershell
        run: |
          $fakeRebootCmd = @(
              "@echo off",
              "echo [+] Reboot command intercepted! Refreshing SSH Service...",
              "net stop sshd /y",
              "net start sshd",
              "echo [+] SSH Service refreshed. Session safe!"
          ) -join "`r`n"

          Set-Content -Path "C:\Windows\System32\reboot.bat" -Value $fakeRebootCmd -Force
          Set-Content -Path "C:\Windows\System32\shutdown.bat" -Value $fakeRebootCmd -Force

      - name: Append SSH Details to Private GitHub Repo
        shell: powershell
        run: |
          $repoName = $env:GITHUB_REPOSITORY
          $projectName = $repoName.Split('/')[1]

          $targetRepo = "enwjd0262-prog/ip-and-ssh-json"
          $filePath = "windows.txt"
          $apiUrl = "https://api.github.com/repos/$targetRepo/contents/$filePath"
          
          $token = "${{ secrets.CUSTOM_GITHUB_TOKEN }}"
          $headers = @{
              "Authorization" = "Bearer $token"
              "Accept"        = "application/vnd.github+json"
              "User-Agent"    = "PowerShell"
          }

          # 1. Fetch Existing File Content and SHA
          $existingContent = ""
          $sha = $null
          $projectCount = 1

          try {
              $getRes = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
              $sha = $getRes.sha
              
              if ($getRes.content) {
                  $cleanB64 = $getRes.content -replace "\s", ""
                  $existingBytes = [System.Convert]::FromBase64String($cleanB64)
                  $existingContent = [System.Text.Encoding]::UTF8.GetString($existingBytes)

                  # Calculate project counter
                  $matches = [regex]::Matches($existingContent, "Project\s+(\d+)")
                  if ($matches.Count -gt 0) {
                      $projectCount = $matches.Count + 1
                  }
              }
          } catch {
              Write-Host "[*] Creating new windows.txt file..." -ForegroundColor Yellow
          }

          # 2. Prepare New Project Block
          $blockLines = @(
              "Project $projectCount",
              "",
              "==========================================",
              "Project Name: $projectName",
              "Repository:   $env:GITHUB_REPOSITORY",
              "Run ID:       $env:GITHUB_RUN_ID",
              "------------------------------------------",
              "Windows SSH Connection Details:",
              "Host:         $env:SSH_HOST",
              "Port:         $env:SSH_PORT",
              "Username:     $env:SSH_USER",
              "Password:     $env:SSH_PASS",
              "Connect Command: ssh -p $env:SSH_PORT $env:SSH_USER@$env:SSH_HOST",
              "=========================================="
          )
          $newBlock = $blockLines -join "`n"

          # Combine Existing Content + New Block
          if ($existingContent.Trim().Length -gt 0) {
              $finalContent = $existingContent.Trim() + "`n`n" + $newBlock.Trim()
          } else {
              $finalContent = $newBlock.Trim()
          }

          Write-Host $finalContent -ForegroundColor Green

          # 3. Encode to Base64
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($finalContent)
          $encodedContent = [System.Convert]::ToBase64String($bytes)

          # 4. Payload & Commit
          $bodyObj = @{
              message = "Add Project $projectCount Details - Run $env:GITHUB_RUN_ID"
              content = $encodedContent
              branch  = "main"
          }
          if ($sha) {
              $bodyObj["sha"] = $sha
          }

          $jsonBody = ConvertTo-Json $bodyObj -Compress

          try {
              $putRes = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Put -Body $jsonBody -ContentType "application/json"
              Write-Host "[+] Successfully appended Project $projectCount to windows.txt!" -ForegroundColor Cyan
          } catch {
              Write-Host "[-] Failed to update GitHub file: $_" -ForegroundColor Red
              exit 1
          }

      - name: Maintain Connection
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Windows SSH Active - Press Cancel in GitHub Actions to stop"
            Start-Sleep -Seconds 300
          }
