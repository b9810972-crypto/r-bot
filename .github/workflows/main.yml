name: Windows Custom Domain RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Desktop (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create Windows Admin User with Random Password
        shell: powershell
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY
          
          # Random Password Generator (16 chars)
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"
          $randomPass = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          $username = "R-BOT"
          $securePass = ConvertTo-SecureString $randomPass -AsPlainText -Force
          Write-Output "::add-mask::$randomPass"

          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASS=$randomPass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Cloudflare Tunnel with Random Subdomain
        shell: powershell
        run: |
          # Generate the hostname that is written to windows.txt.
          $randNum = Get-Random -Minimum 10000000 -Maximum 99999999
          $fullDomain = "$randNum.co08.art"
          Write-Host "[+] Generated Random Domain URL: $fullDomain" -ForegroundColor Cyan
          "FULL_DOMAIN=$fullDomain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Download cloudflared once; the process is started in the final long-running step.
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          $exePath = "$env:TEMP\cloudflared.exe"
          Invoke-WebRequest -Uri $cfUrl -OutFile $exePath
          if (!(Test-Path $exePath)) {
              Write-Error "cloudflared download failed."
              exit 1
          }
          "CLOUDFLARED_PATH=$exePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Append Custom Domain RDP Details to Private GitHub Repo
        shell: powershell
        run: |
          $repoName = $env:GITHUB_REPOSITORY
          $projectName = $repoName.Split('/')[1]

          $targetRepo = "enwjd0262-prog/ip-and-ssh-json"
          $filePath = "windows.txt"
          $apiUrl = "https://api.github.com/repos/$targetRepo/contents/$filePath"
          
          $token = "${{ secrets.CUSTOM_GITHUB_TOKEN }}"
          $headers = @{
              "Authorization" = "Bearer $token"
              "Accept"        = "application/vnd.github+json"
              "User-Agent"    = "PowerShell"
          }

          # 1. Fetch Existing File Content and SHA
          $existingContent = ""
          $sha = $null
          $projectCount = 1

          try {
              $getRes = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
              $sha = $getRes.sha
              
              if ($getRes.content) {
                  $cleanB64 = $getRes.content -replace "\s", ""
                  $existingBytes = [System.Convert]::FromBase64String($cleanB64)
                  $existingContent = [System.Text.Encoding]::UTF8.GetString($existingBytes)

                  # Calculate project counter
                  $matches = [regex]::Matches($existingContent, "Project\s+(\d+)")
                  if ($matches.Count -gt 0) {
                      $projectCount = $matches.Count + 1
                  }
              }
          } catch {
              Write-Host "[*] Creating new windows.txt file..." -ForegroundColor Yellow
          }

          # 2. Prepare New Project Block with Random Subdomain
          $blockLines = @(
              "Project $projectCount",
              "",
              "==========================================",
              "Project Name: $projectName",
              "Repository:   $env:GITHUB_REPOSITORY",
              "Run ID:       $env:GITHUB_RUN_ID",
              "------------------------------------------",
              "Windows Custom Domain RDP Details:",
              "Domain URL:   $env:FULL_DOMAIN",
              "Username:     $env:RDP_USER",
              "Password:     $env:RDP_PASS",
              "=========================================="
          )
          $newBlock = $blockLines -join "`n"

          # Combine Existing Content + New Block
          if ($existingContent.Trim().Length -gt 0) {
              $finalContent = $existingContent.Trim() + "`n`n" + $newBlock.Trim()
          } else {
              $finalContent = $newBlock.Trim()
          }

          Write-Host "[+] Prepared RDP details for $projectName (credentials are masked)." -ForegroundColor Green

          # 3. Encode to Base64
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($finalContent)
          $encodedContent = [System.Convert]::ToBase64String($bytes)

          # 4. Payload & Commit
          $bodyObj = @{
              message = "Add Project $projectCount Random Subdomain RDP - Run $env:GITHUB_RUN_ID"
              content = $encodedContent
              branch  = "main"
          }
          if ($sha) {
              $bodyObj["sha"] = $sha
          }

          $jsonBody = ConvertTo-Json $bodyObj -Compress

          try {
              $putRes = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Put -Body $jsonBody -ContentType "application/json"
              Write-Host "[+] Successfully appended Project $projectCount to windows.txt!" -ForegroundColor Cyan
          } catch {
              Write-Host "[-] Failed to update GitHub file: $_" -ForegroundColor Red
              exit 1
          }

      - name: Keep Cloudflare Tunnel Alive
        shell: powershell
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          $exePath = if ($env:CLOUDFLARED_PATH) { $env:CLOUDFLARED_PATH } else { "$env:TEMP\cloudflared.exe" }
          $stderrPath = "$env:TEMP\cloudflared-live.log"
          $stdoutPath = "$env:TEMP\cloudflared-live-out.log"

          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_TUNNEL_TOKEN)) {
              Write-Error "CF_TUNNEL_TOKEN GitHub secret is not configured."
              exit 1
          }

          # Accept a raw connector token or a full cloudflared command pasted into the secret.
          $tunnelToken = $env:CLOUDFLARE_TUNNEL_TOKEN.Trim()
          if ($tunnelToken -match "(?i)--token\s+([^\s]+)") { $tunnelToken = $matches[1] }
          $tunnelToken = $tunnelToken.Trim().Trim("'").Trim('"')
          if ([string]::IsNullOrWhiteSpace($tunnelToken)) {
              Write-Error "CF_TUNNEL_TOKEN is empty after parsing."
              exit 1
          }

          function Start-Tunnel {
              Remove-Item $stderrPath, $stdoutPath -Force -ErrorAction SilentlyContinue
              $process = Start-Process $exePath -ArgumentList @(
                  "tunnel", "--no-autoupdate", "run", ("--token=" + $tunnelToken)
              ) -RedirectStandardError $stderrPath -RedirectStandardOutput $stdoutPath -PassThru
              Start-Sleep -Seconds 8
              $process.Refresh()
              if ($process.HasExited) {
                  Write-Host "=== CLOUDFLARED ERROR ===" -ForegroundColor Red
                  if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
                  if (Test-Path $stderrPath) { Get-Content $stderrPath }
                  Write-Error "Cloudflare tunnel exited during startup with code $($process.ExitCode)."
                  exit 1
              }
              Write-Host "[+] Cloudflare tunnel is running for $env:FULL_DOMAIN." -ForegroundColor Green
              return $process
          }

          $tunnel = Start-Tunnel
          $restartCount = 0
          try {
              while ($true) {
                  Start-Sleep -Seconds 15
                  $tunnel.Refresh()
                  if ($tunnel.HasExited) {
                      $restartCount++
                      if ($restartCount -gt 5) {
                          Write-Host "=== CLOUDFLARED LAST ERROR ===" -ForegroundColor Red
                          if (Test-Path $stderrPath) { Get-Content $stderrPath }
                          Write-Error "Cloudflare tunnel stopped repeatedly; giving up after 5 restarts."
                          exit 1
                      }
                      Write-Host "[!] Cloudflare tunnel disconnected; restarting ($restartCount/5)..." -ForegroundColor Yellow
                      $tunnel = Start-Tunnel
                  } else {
                      Write-Host "[$(Get-Date)] RDP tunnel active for $env:FULL_DOMAIN" -ForegroundColor DarkGreen
                  }
              }
          } finally {
              if ($tunnel -and -not $tunnel.HasExited) { Stop-Process -Id $tunnel.Id -Force -ErrorAction SilentlyContinue }
          }
