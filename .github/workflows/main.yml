name: Permanent RDP
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration in hours (default: 12)'
        required: false
        default: '12'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 43200
    steps:
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          powercfg /change standby-timeout-ac 0
          powercfg /change standby-timeout-dc 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          Restart-Service -Name TermService -Force

      - name: Create Fixed User
        run: |
          $password = "RDP@Secure2026!@#"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Force
          }
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Setup Tailscale
        run: |
          Get-Process -Name "tailscale" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "tailscaled" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout 2>$null
          Start-Sleep -Seconds 3
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-permanent --accept-routes=true --accept-dns=false --reset
          
          Start-Sleep -Seconds 10
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 30) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if (-not $tsIP) {
              Write-Host "Waiting for Tailscale IP... ($retries/30)"
              Start-Sleep -Seconds 5
              $retries++
            }
          }
          
          if (-not $tsIP) {
            Write-Error "Failed to get Tailscale IP"
            exit 1
          }
          
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Show Credentials
        run: |
          Write-Host "=================================================="
          Write-Host "   RDP ACCESS DETAILS"
          Write-Host "=================================================="
          Write-Host "IP Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=================================================="

      - name: Keep Alive with Auto-Reconnect
        run: |
          $endTime = (Get-Date).AddHours(${{ github.event.inputs.duration }})
          $lastStatus = Get-Date
          $reconnectAttempts = 0
          
          while ((Get-Date) -lt $endTime) {
            try {
              if ((Get-Date) - $lastStatus -gt [TimeSpan]::FromMinutes(1)) {
                $remaining = ($endTime - (Get-Date)).ToString('hh\:mm\:ss')
                
                $ping = Test-Connection -ComputerName "100.100.100.100" -Count 1 -Quiet -ErrorAction SilentlyContinue
                $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
                
                if (-not $ping -or -not $ip) {
                  Write-Host "Connection issue detected! Reconnecting... (Attempt $reconnectAttempts)"
                  $reconnectAttempts++
                  
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" logout 2>$null
                  Start-Sleep -Seconds 5
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-permanent --accept-routes=true
                  Start-Sleep -Seconds 10
                  
                  $newIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
                  if ($newIP) {
                    Write-Host "Reconnected! New IP: $newIP"
                  }
                } else {
                  Write-Host "Session active - Remaining: $remaining | Reconnects: $reconnectAttempts"
                }
                
                $lastStatus = Get-Date
              }
              
              Start-Sleep -Seconds 30
            } catch {
              Write-Host "Error in main loop: $_"
              Start-Sleep -Seconds 10
            }
          }
          
          Write-Host "Session completed!"

      - name: Cleanup
        if: always()
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout 2>$null
          Get-Process -Name "tailscale" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "tailscaled" -ErrorAction SilentlyContinue | Stop-Process -Force
